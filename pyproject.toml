[project]
name = "tgdoctor"
version = "0.1.0"
description = "Polish pharmaceutical registry search for Telegram"
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "python-telegram-bot==22.8",
]

[project.scripts]
tgdoctor = "tgdoctor.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.13.5"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
    "ty==0.0.91",
    "types-defusedxml==0.7.0.20260504",
]
